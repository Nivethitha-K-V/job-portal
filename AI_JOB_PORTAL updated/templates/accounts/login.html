{% extends 'base.html' %}
{% block title %}Login | AI Job Portal{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="card-glass p-5 mx-auto" style="max-width:480px;">
    <h2 class="section-title text-center">Welcome Back</h2>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Username</label>
        {{ form.username }}
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        {{ form.password }}
      </div>
      {% if form.errors %}
        <div class="alert alert-danger">Please check your username and password.</div>
      {% endif %}
      <button type="submit" class="btn btn-pastel-primary w-100 mb-3">Login</button>
      <p class="text-center text-muted mb-0">Don't have an account? <a href="{% url 'register' %}">Sign up</a></p>
    </form>
  </div>
</div>
{% endblock %}
